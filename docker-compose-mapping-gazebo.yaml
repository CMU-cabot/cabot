services:
  mapping:
    extends:
      file: cabot-navigation/docker-compose-common.yaml
      service: localization-base
    environment:
      - DISPLAY
      - XAUTHORITY=/tmp/.docker.xauth
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility,video,display
      - NVIDIA_VISIBLE_DEVICES=all
      - OUTPUT_PREFIX
      - RUN_CARTOGRAPHER=${RUN_CARTOGRAPHER:-true}
      - USE_XSENS
      - USE_ESP32
      - USE_ARDUINO
      - CABOT_MODEL
      - PLAYBAG_RATE_CARTOGRAPHER
      - PLAYBAG_RATE_PC2_CONVERT
      - CONVERT_BAG
      - CABOT_ROSBAG_RECORD_CAMERA
      - MAPPING_RESOLUTION
      - MAPPING_USE_GNSS
      # ROS2/DDS
      - ROS_LOG_DIR
      - RMW_IMPLEMENTATION
      - ROS_DOMAIN_ID
      - ROS_LOCALHOST_ONLY
      - CYCLONEDDS_URI
      - CYCLONEDDS_NETWORK_INTERFACE_NAME
      - CYCLONEDDS_NETWORK_INTERFACE_AUTODETERMINE
    volumes:
      - /dev:/dev
      - /sys/devices:/sys/devices
      - /var/lib/bluetooth:/var/lib/bluetooth
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth
      # home
      - ./docker/home:/home/developer
      # code
      - ./cabot-navigation/cabot_sites:/home/developer/mapping_ws/src/cabot_sites
      - ./cabot-drivers/cabot_serial:/home/developer/mapping_ws/src/cabot_serial
      - ./cabot-navigation/cabot_mf_localization:/home/developer/mapping_ws/src/cabot_mf_localization
      - ./cabot-navigation/mf_localization:/home/developer/mapping_ws/src/mf_localization
      - ./cabot-navigation/mf_localization_mapping:/home/developer/mapping_ws/src/mf_localization_mapping
      - ./cabot-drivers/wireless_scanner_ros:/home/developer/mapping_ws/src/wireless_scanner_ros
# bridge - if DDS use shared memory
      - /dev/shm:/dev/shm
    privileged: true
    devices:
      - /dev/dri
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    network_mode: host
    tty: true
    stdin_open: true
    working_dir: /home/developer/mapping_ws
    command: /launch.sh mapping -C -X -s

  # gazebo server
  gazebo:
    extends:
      file: docker-compose-common.yaml
      service: gazebo-dev
    profiles:
      - start_gazebo
    environment:
      - CABOT_GAZEBO=1
      - CABOT_USE_SIM_TIME=1

  # gazebo client, rviz2, and teleop_twist_keyboard
  gui:
    extends:
      file: docker-compose-common.yaml
      service: gui-dev
    profiles:
      - start_gazebo
    environment:
      - CABOT_GAZEBO=1
      - CABOT_USE_SIM_TIME=1
      - CABOT_SHOW_GAZEBO_CLIENT=1
      - CABOT_GUI_TELEOP_TWIST_TOPIC=/cabot/cmd_vel  # remap config for teleop_twist_keyboard node

  # navigation container for running teleop_gamepad
  navigation:
    extends:
      file: docker-compose-common.yaml
      service: navigation-dev
    profiles:
      - teleop_gamepad
    environment:
      - CABOT_GAZEBO=1
      - CABOT_USE_SIM_TIME=1
    command:  bash -c "source install/setup.bash && ros2 launch cabot_ui teleop_gamepad.launch.py cmd_vel:=/cabot/cmd_vel"