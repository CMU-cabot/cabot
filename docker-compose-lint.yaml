services:
  lint:
    image: ghcr.io/super-linter/super-linter:slim-v6.3.1
    environment:
      - LOG_LEVEL=INFO
      - RUN_LOCAL=true
      - DEFAULT_BRANCH=ros2-dev
      - IGNORE_GITIGNORED_FILES=true
      - NATURAL_LANGUAGE=false
      - VALIDATE_PYTHON_PYLINT=false
      - VALIDATE_CHECKOV=false
      - VALIDATE_DOCKERFILE_HADOLINT=false
    volumes:
      - ./:/tmp/lint
