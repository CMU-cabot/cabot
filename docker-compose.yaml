# configuration of simulation for single PC
# services extend from docker-compose-common.yaml

services:
  # build
  navigation:
    extends:
      file: docker-compose-common.yaml
      service: sngnn-dev
    profiles:
      - build

  localization:
    extends:
      file: docker-compose-common.yaml
      service: localization-dev
    profiles:
      - build

  people:
    extends:
      file: docker-compose-common.yaml
      service: people-dev
    profiles:
      - build

  people-framos:
    extends:
      file: docker-compose-common.yaml
      service: people-framos-dev
    profiles:
      - build

  people-nuc:
    extends:
      file: docker-compose-common.yaml
      service: people-nuc-dev
    profiles:
      - build

  bag:
    extends:
      file: docker-compose-common.yaml
      service: bag-dev
    volumes:
      - ./docker/home:/home/developer/
    profiles:
      - build

  driver:
    extends:
      file: docker-compose-common.yaml
      service: driver-dev
    profiles:
      - build

  mapping:
    extends:
      file: docker-compose-mapping.yaml
      service: mapping
    profiles:
      - build

  diagnostic:
    extends:
      file: docker-compose-mapping.yaml
      service: diagnostic
    profiles:
      - build

  map_server:
    extends:
      file: cabot-navigation/docker-compose.yaml
      service: map_server
    networks: !override []
    profiles:
      - build

  location_tools:
    extends:
      file: cabot-navigation/docker-compose.yaml
      service: location_tools
    networks: !override []
    profiles:
      - build

  mongodb_ms:
    extends:
      file: cabot-navigation/docker-compose.yaml
      service: mongodb_ms
    networks: !override []
    profiles:
      - build

  mongodb_lt:
    extends:
      file: cabot-navigation/docker-compose.yaml
      service: mongodb_lt
    networks: !override []
    profiles:
      - build

  app-server:
    extends:
      file: cabot-app-server/docker-compose.yaml
      service: app-server
    profiles:
      - build

  dashboard-client:
    extends:
      file: cabot-dashboard/docker-compose.yaml
      service: dashboard-client
    profiles:
      - build

  influxdb-client:
    extends:
      file: cabot-grafana/docker-compose.yaml
      service: influxdb-client
    profiles:
      - build

  embedding:
    extends:
      file: cabot-navigation/docker-compose-common.yaml
      service: embedding
    profiles:
      - build

  # dev
  navigation-dev:
    extends:
      file: docker-compose-common.yaml
      service: navigation-dev
    environment:
      - CABOT_GAZEBO=1
      - CABOT_USE_SIM_TIME=1
      - CABOT_TOUCH_ENABLED=${CABOT_TOUCH_ENABLED:-false}
    profiles:
      - dev

  vlm:
    extends:
      file: docker-compose-common.yaml
      service: navigation-dev
    command: /bin/bash -c "source install/setup.bash && export AMENT_PREFIX_PATH=/home/developer/ros2_ws/install/vlm_social_nav:$$AMENT_PREFIX_PATH && ros2 launch vlm_social_nav vlm_social_nav_system.launch.py view_image:=false"
    volumes:
      - ./docker/home/ros2_ws/install:/home/developer/ros2_ws/install:ro
    profiles:
      - vlm

  vlm-rank:
    build:
      context: ./VLM_Rank_Nav/docker
      dockerfile: Dockerfile
    image: cmucal/cabot-vlm-rank:${CABOT_LAUNCH_IMAGE_TAG:-latest}
    network_mode: host
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - ROS_DOMAIN_ID
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION
      - CYCLONEDDS_URI=file:///etc/cyclonedds/config.xml
      - DISPLAY
      - CABOT_VLM_RANKNAV_CAMERA_SERIAL
    volumes:
      - ./VLM_Rank_Nav:/workspace
      - ./cabot-navigation/rank_nav_msgs:/tmp/rank_nav_msgs_src:ro
      - ./cabot-people/track_people_msgs:/tmp/track_people_msgs_src:ro
      - ./host_ws/src/people_msgs:/tmp/people_msgs_src:ro
      - ./VLM_Rank_Nav/docker/cyclonedds.xml:/etc/cyclonedds/config.xml
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/shm:/dev/shm
    devices:
      - /dev/dri:/dev/dri
    stdin_open: true
    tty: true
    command: >
      python3 /workspace/cabot_run.py
      --camera-serial ${CABOT_VLM_RANKNAV_CAMERA_SERIAL}
      --scoring-model /workspace/distillation/checkpoints/ranking_distillation_model.pth
      --device cuda:0
      --image-topic /camera/color/image_raw
      --camera-info-topic /camera/color/camera_info
      --min-depth 0.3
      --max-depth 30.0
      --tracked-boxes-topic /people/detected_boxes
      --odom-topic /odom
    profiles:
      - vlm-rank

  gazebo-dev:
    extends:
      file: docker-compose-common.yaml
      service: gazebo-dev
    profiles:
      - dev

  gui-dev:
    extends:
      file: docker-compose-common.yaml
      service: gui-dev
    environment:
      - CABOT_GAZEBO=1
      - CABOT_USE_SIM_TIME=1
    profiles:
      - dev

  localization-dev:
    extends:
      file: docker-compose-common.yaml
      service: localization-dev
    environment:
      - CABOT_GAZEBO=1
      - CABOT_USE_SIM_TIME=1
    profiles:
      - dev

  people-dev:
    extends:
      file: docker-compose-common.yaml
      service: people-dev
    environment:
      - CABOT_GAZEBO=1
      - CABOT_USE_SIM_TIME=1
    profiles:
      - dev

  embedding-dev:
    extends:
      file: docker-compose-common.yaml
      service: embedding-dev
    profiles:
      - dev

  # prodimg
  navigation-prod:
    extends:
      file: docker-compose-common.yaml
      service: navigation-prod
    environment:
      - CABOT_GAZEBO=1
      - CABOT_USE_SIM_TIME=1
      - CABOT_TOUCH_ENABLED=${CABOT_TOUCH_ENABLED:-false}
    profiles:
      - prod

  gazebo-prod:
    extends:
      file: docker-compose-common.yaml
      service: gazebo-prod
    profiles:
      - prod

  gui-prod:
    extends:
      file: docker-compose-common.yaml
      service: gui-prod
    environment:
      - CABOT_GAZEBO=1
      - CABOT_USE_SIM_TIME=1
    profiles:
      - prod

  localization-prod:
    extends:
      file: docker-compose-common.yaml
      service: localization-prod
    environment:
      - CABOT_GAZEBO=1
      - CABOT_USE_SIM_TIME=1
    profiles:
      - prod

  people-prod:
    extends:
      file: docker-compose-common.yaml
      service: people-prod
    environment:
      - CABOT_GAZEBO=1
      - CABOT_USE_SIM_TIME=1
    profiles:
      - prod

  embedding-prod:
    extends:
      file: docker-compose-common.yaml
      service: embedding-prod
    profiles:
      - prod

  sngnn:
    extends:
      file: docker-compose-common.yaml
      service: sngnn-dev
    profiles:
      - build
      - sngnn
