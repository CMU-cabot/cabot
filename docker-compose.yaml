# configuration of simulation for single PC
# services extend from docker-compose-common.yaml

services:
  # build
  navigation:
    extends:
      file: docker-compose-common.yaml
      service: navigation-dev
    profiles:
      - build

  localization:
    extends:
      file: docker-compose-common.yaml
      service: localization-dev
    profiles:
      - build

  people:
    extends:
      file: docker-compose-common.yaml
      service: people-dev
    profiles:
      - build

  people-framos:
    extends:
      file: docker-compose-common.yaml
      service: people-framos-dev
    profiles:
      - build

  people-nuc:
    extends:
      file: docker-compose-common.yaml
      service: people-nuc-dev
    profiles:
      - build

  bag:
    extends:
      file: docker-compose-common.yaml
      service: bag-dev
    volumes:
      - ./docker/home:/home/developer/
    profiles:
      - build

  driver:
    extends:
      file: docker-compose-common.yaml
      service: driver-dev
    profiles:
      - build

  mapping:
    extends:
      file: docker-compose-mapping.yaml
      service: mapping
    profiles:
      - build

  diagnostic:
    extends:
      file: docker-compose-mapping.yaml
      service: diagnostic
    profiles:
      - build

  map_server:
    extends:
      file: cabot-navigation/docker-compose.yaml
      service: map_server
    networks: !override []
    profiles:
      - build

  location_tools:
    extends:
      file: cabot-navigation/docker-compose.yaml
      service: location_tools
    networks: !override []
    profiles:
      - build

  mongodb_ms:
    extends:
      file: cabot-navigation/docker-compose.yaml
      service: mongodb_ms
    networks: !override []
    profiles:
      - build

  mongodb_lt:
    extends:
      file: cabot-navigation/docker-compose.yaml
      service: mongodb_lt
    networks: !override []
    profiles:
      - build

  app-server:
    extends:
      file: cabot-app-server/docker-compose.yaml
      service: app-server
    profiles:
      - build

  dashboard-client:
    extends:
      file: cabot-dashboard/docker-compose.yaml
      service: dashboard-client
    profiles:
      - build

  influxdb-client:
    extends:
      file: cabot-grafana/docker-compose.yaml
      service: influxdb-client
    profiles:
      - build

  # dev
  navigation-dev:
    extends:
      file: docker-compose-common.yaml
      service: navigation-dev
    environment:
      - CABOT_GAZEBO=1
      - CABOT_USE_SIM_TIME=1
      - CABOT_TOUCH_ENABLED=${CABOT_TOUCH_ENABLED:-false}
    profiles:
      - dev

  gazebo-dev:
    extends:
      file: docker-compose-common.yaml
      service: gazebo-dev
    profiles:
      - dev

  gui-dev:
    extends:
      file: docker-compose-common.yaml
      service: gui-dev
    environment:
      - CABOT_GAZEBO=1
      - CABOT_USE_SIM_TIME=1
    profiles:
      - dev

  localization-dev:
    extends:
      file: docker-compose-common.yaml
      service: localization-dev
    environment:
      - CABOT_GAZEBO=1
      - CABOT_USE_SIM_TIME=1
    profiles:
      - dev

  people-dev:
    extends:
      file: docker-compose-common.yaml
      service: people-dev
    environment:
      - CABOT_GAZEBO=1
      - CABOT_USE_SIM_TIME=1
    profiles:
      - dev

  # prodimg
  navigation-prod:
    extends:
      file: docker-compose-common.yaml
      service: navigation-prod
    environment:
      - CABOT_GAZEBO=1
      - CABOT_USE_SIM_TIME=1
      - CABOT_TOUCH_ENABLED=${CABOT_TOUCH_ENABLED:-false}
    profiles:
      - prod

  gazebo-prod:
    extends:
      file: docker-compose-common.yaml
      service: gazebo-prod
    profiles:
      - prod

  gui-prod:
    extends:
      file: docker-compose-common.yaml
      service: gui-prod
    environment:
      - CABOT_GAZEBO=1
      - CABOT_USE_SIM_TIME=1
    profiles:
      - prod

  localization-prod:
    extends:
      file: docker-compose-common.yaml
      service: localization-prod
    environment:
      - CABOT_GAZEBO=1
      - CABOT_USE_SIM_TIME=1
    profiles:
      - prod

  people-prod:
    extends:
      file: docker-compose-common.yaml
      service: people-prod
    environment:
      - CABOT_GAZEBO=1
      - CABOT_USE_SIM_TIME=1
    profiles:
      - prod

