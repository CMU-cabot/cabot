      service: embedding-prod
    volumes:
      - ./docker/home/.ros:/home/developer/.ros
      - ./docker/home/.cache:/home/developer/.cache

  bag-base:
    image: cmucal/cabot-bag:${CABOT_LAUNCH_IMAGE_TAG:-latest}
    build:
      context: ./docker/bag
      additional_contexts:
        cabot_src: ./
      args:
        - BASE_IMAGE=${BASE_IMAGE:-cabot-base}
      x-bake:
        tags:
          - ${REGISTRY:-cmucal}/cabot-bag
        platforms:
          - linux/amd64
          - linux/arm64
        output:
          - type=registry
    environment:
      - DISPLAY
      - XAUTHORITY=/tmp/.docker.xauth
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility,video,display
      - NVIDIA_VISIBLE_DEVICES=all
      - LIBGL_ALWAYS_SOFTWARE
      - __NV_PRIME_RENDER_OFFLOAD
      - __GLX_VENDOR_LIBRARY_NAME
      - HOST_UID
      - HOST_GID
      - HOST_TZ
      - CABOT_ROSBAG_BACKEND
      - CABOT_ROSBAG_COMPRESSION
      - CABOT_ROSBAG_RECORD_CAMERA
      - CABOT_ROSBAG_SEPARATE_LOG
      - CABOT_ROSBAG_CAMERA_THROTTLE_HZ
      - CABOT_SHOW_ROS2_LOCAL_RVIZ
      - CABOT_USE_DIRECTIONAL_INDICATOR
      - CABOT_ROS2_RVIZ_CONFIG
      - CABOT_ROS2_LOCAL_RVIZ_CONFIG
# ROS2/DDS
      - ROS_LOG_DIR
      - RMW_IMPLEMENTATION
      - ROS_LOCALHOST_ONLY
      - ROS_DOMAIN_ID
      - CYCLONEDDS_URI
      - CYCLONEDDS_NETWORK_INTERFACE_NAME
      - CYCLONEDDS_NETWORK_INTERFACE_AUTODETERMINE # set automatically by launch.sh
    volumes:
# device, bluetooth
      - /dev:/dev
      - /sys/devices:/sys/devices
# display
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth
# bridge - if DDS use shared memory
      - /dev/shm:/dev/shm
    working_dir: /home/developer/bag_ws
    devices:
      - /dev/dri
    privileged: true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    network_mode: host
    stop_signal: SIGINT
    stop_grace_period: 30s
    command: /launch.sh record

  bag-dev:
    extends:
      service: bag-base
    volumes:
# code
      - ./cabot-navigation/cabot_sites:/home/developer/bag_ws/src/cabot_sites
      - ./cabot-common/cabot_msgs:/home/developer/bag_ws/src/cabot_msgs
      - ./cabot-common/cabot_common:/home/developer/bag_ws/src/cabot_common
      - ./cabot_debug:/home/developer/bag_ws/src/cabot_debug
      - ./cabot-drivers/motor_controller:/home/developer/bag_ws/src/motor_controller
      - ./cabot-drivers/docker/driver/ros_odrive/odrive_base:/home/developer/bag_ws/src/ros_odrive/odrive_base
      - ./cabot-drivers/docker/driver/ros_odrive/odrive_node:/home/developer/bag_ws/src/ros_odrive/odrive_node
      - ./cabot-drivers/power_controller/power_controller_msgs:/home/developer/bag_ws/src/power_controller/power_controller_msgs
      - ./cabot-navigation/cabot_gazebo:/home/developer/bag_ws/cabot_gazebo
      - ./cabot-navigation/script:/home/developer/bag_ws/script
      - ./cabot-navigation/mf_localization_msgs:/home/developer/bag_ws/src/mf_localization_msgs
      - ./cabot-navigation/mf_localization_rviz:/home/developer/bag_ws/src/mf_localization_rviz
      - ./cabot-navigation/queue_msgs:/home/developer/bag_ws/src/queue_msgs
      - ./cabot-people/track_people_msgs:/home/developer/bag_ws/src/track_people_msgs
      - ./cabot-description/cabot_description:/home/developer/bag_ws/src/cabot_description
      - ./cabot-navigation/docker/localization/ublox/ublox_msgs:/home/developer/bag_ws/src/ublox_msgs
      - ./cabot-navigation/docker/localization/ublox/ublox_serialization:/home/developer/bag_ws/src/ublox_serialization
      - ./cabot-navigation/docker/localization/cartographer_ros/cartographer_ros_msgs:/home/developer/bag_ws/src/cartographer_ros_msgs
      - ./cabot-base/docker/humble-custom/velodyne/velodyne_msgs:/home/developer/bag_ws/src/velodyne_msgs
      - ./host_ws/src/tf_bag:/home/developer/bag_ws/src/tf_bag
      - ${CABOT_BAG_MOUNT:-./doc}:/ros2_topics

  bag-prod:
    extends:
      service: bag-base
    volumes:
      - ${CABOT_BAG_MOUNT:-./doc}:/ros2_topics
