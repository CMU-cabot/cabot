  people-nuc-prod:
    extends:
      file: cabot-people/docker-compose-base.yaml
      service: people-nuc-base
    volumes:
      - ./docker/home/cyclonedds_spdp.xml:/home/developer/cyclonedds_spdp.xml
      - ./docker/home/.ros:/home/developer/.ros

  wifi_scan-dev:
    extends:
      file: cabot-drivers/docker-compose-base.yaml
      service: wifi_scan-dev-base
    volumes:
      - ./docker/home:/home/developer

  wifi_scan-prod:
    extends:
      file: cabot-drivers/docker-compose-base.yaml
      service: wifi_scan-prod-base
    volumes:
      - ./docker/home/cyclonedds_spdp.xml:/home/developer/cyclonedds_spdp.xml
      - ./docker/home/.ros:/home/developer/.ros

  ble_scan-dev:
    extends:
      file: cabot-drivers/docker-compose-base.yaml
      service: ble_scan-dev-base
    volumes:
      - ./docker/home:/home/developer

  ble_scan-prod:
    extends:
      file: cabot-drivers/docker-compose-base.yaml
      service: ble_scan-prod-base
    volumes:
      - ./docker/home/cyclonedds_spdp.xml:/home/developer/cyclonedds_spdp.xml
      - ./docker/home/.ros:/home/developer/.ros

  bag:
    image: cmucal/cabot-bag
    build:
      context: ./docker/bag
      additional_contexts:
        cabot_src: ./
      args:
        - BASE_IMAGE=${BASE_IMAGE:-cabot-base}
      x-bake:
        tags:
          - ${REGISTRY:-cmucal}/cabot-bag
        platforms:
          - linux/amd64
          - linux/arm64
        output:
          - type=registry
    environment:
      - DISPLAY
      - XAUTHORITY=/tmp/.docker.xauth
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility,video,display
      - NVIDIA_VISIBLE_DEVICES=all
      - ROS_LOG_DIR
      - CABOT_ROSBAG_BACKEND
      - CABOT_ROSBAG_COMPRESSION
      - CABOT_ROSBAG_RECORD_CAMERA
      - CABOT_ROSBAG_SEPARATE_LOG
      - CABOT_SHOW_ROS2_LOCAL_RVIZ
      - RMW_IMPLEMENTATION
      - ROS_DOMAIN_ID
    volumes:
# device, bluetooth
      - /dev:/dev
      - /sys/devices:/sys/devices
# display
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth
# bridge - if DDS use shared memory
      - /dev/shm:/dev/shm
    working_dir: /home/developer/bag_ws
    devices:
      - /dev/dri
    privileged: true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    network_mode: host
    stop_signal: SIGINT
    command: /launch.sh record
