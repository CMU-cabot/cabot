services:
  # dev
  bag-dev:
    extends:
      file: docker-compose-common.yaml
      service: bag-dev
    volumes:
      - ./docker/home:/home/developer/
    profiles:
      - dev

  # prodimg
  bag-prod:
    extends:
      file: docker-compose-common.yaml
      service: bag-prod
    volumes:
      - ./docker/home/cyclonedds_spdp.xml:/home/developer/cyclonedds_spdp.xml
      - ./docker/home/.ros:/home/developer/.ros
    profiles:
      - prod
